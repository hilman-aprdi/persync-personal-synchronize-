name: Build & Verify

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint Next.js
        run: npm run lint --if-present

      - name: Build Next.js Application
        run: npm run build
        env:
          GEMINI_API_KEY: "mock_key_for_build"
          QUOTA_SECRET: "mock_secret_for_build"

      - name: Verification Passed
        run: echo "✅ Next.js application built successfully! Ready for Vercel deployment."
